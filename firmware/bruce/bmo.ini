; BMO v1 (dark-bmo) para o Bruce: ESP32-S3 DevKitC-1 N16R8 + tela ILI9341 3,2" + 3 botões
; + CC1101. Pinagem: README do dark-bmo > Pinagem. O touch da tela fica sem uso.
; Usa a placa ESP-General do Bruce (que já inclui os pinos SPI 10/11/12/13) e define o
; resto por flags, sem alterar o código do Bruce. Compilar com firmware/bruce/build.sh.

[env:bmo-v1]
board = ESP-General
board_build.arduino.memory_type = qio_opi ; PSRAM octal do N16R8
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
build_src_filter = ${env.build_src_filter} +<../boards/bmo>
build_flags =
	${env.build_flags}
	-Iboards/bmo
	-DBOARD_HAS_PSRAM=1
	-DUSB_as_HID=1
	-DDEVICE_NAME='"BMO v1"'

	; IR (README: RX 4, TX 5) e liberdade de escolher outro GPIO no menu
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	-DTXLED=5
	-DRXLED=4
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; I2C (PN532 e cartuchos)
	-DGROVE_SDA=8
	-DGROVE_SCL=9

	; SPI compartilhado: tela, CC1101 e microSD
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=14

	; microSD (módulo separado, ainda não ligado)
	-DSDCARD_CS=21
	-DSDCARD_SCK=12
	-DSDCARD_MISO=13
	-DSDCARD_MOSI=11

	; tela ILI9341
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=160
	-DSMOOTH_FONT=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_DISPON=0x29
	-DTFT_DISPOFF=0x28
	-DTFT_CS=10
	-DTFT_DC=17
	-DTFT_RST=18
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_MISO=13
	-DTFT_BL=16
	-DTFT_BACKLIGHT_ON=1
	; Sem isto o TFT_eSPI usa o SPI 0 no core 3 do ESP32-S3 (endereço nulo) e trava no boot.
	; As outras placas S3 do Bruce fazem igual. CC1101 e SD reaproveitam esse SPI porque
	; compartilham o MOSI com a tela.
	-DUSE_HSPI_PORT=1
	; ponytail: 10 MHz é o que foi testado nos jumpers (teste_tela); na PCB dá para subir a 40 MHz
	-DSPI_FREQUENCY=10000000
	-DSPI_READ_FREQUENCY=10000000

	; 3 botões ligando o GPIO ao GND (pull-up interno). Cima+baixo juntos = voltar.
	; Evita 38 e 48: um dos dois é o LED RGB da DevKitC, conforme a revisão da placa.
	; OK no GPIO 2 porque acordar do deep sleep exige um GPIO RTC (0 a 21).
	-DHAS_3_BUTTONS=1
	-DUP_BTN=39
	-DSEL_BTN=2
	-DDW_BTN=47
	-DBTN_ACT=LOW
	-DDEEPSLEEP_WAKEUP_PIN=2
	-DBTN_ALIAS='"OK"'

	; tamanhos de texto
	-DFP=1
	-DFM=2
	-DFG=3

	; CC1101 (CS exclusivo 14, GDO0 15)
	-DCC1101_GDO0_PIN=15
	-DCC1101_SS_PIN=14
	-DCC1101_MOSI_PIN=11
	-DCC1101_SCK_PIN=12
	-DCC1101_MISO_PIN=13

lib_deps =
	${env.lib_deps}
; Sem LED RGB no BMO. E o FastLED mais novo (3.10.8) quebra com o -DFP=1 que o Bruce usa.
lib_ignore =
	FastLED
